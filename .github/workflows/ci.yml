name: CI

# Validation only - no AWS credentials, no deployment. Runs on every push and
# pull request so broken config is caught before it reaches a server.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform — format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      # -backend=false: validation needs the providers and modules, but must
      # not touch the real S3 state.
      - name: Init without backend
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate
        run: terraform validate
        working-directory: terraform

  ansible:
    name: Ansible — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install --disable-pip-version-check ansible

      - name: Install Galaxy dependencies
        run: ansible-galaxy install -r requirements.yml
        working-directory: ansible

      # inventory.ini is generated by Terraform and lists private addresses
      # that do not exist on a runner, so point at a throwaway inventory.
      - name: Syntax check every playbook
        working-directory: ansible
        run: |
          printf '[web]\nweb-server ansible_host=10.0.0.5\n\n[monitoring]\nmonitoring-server ansible_host=10.0.0.136\n' > /tmp/ci-inventory.ini
          for p in playbook-*.yaml site.yaml; do
            echo "--- $p"
            ansible-playbook --syntax-check -i /tmp/ci-inventory.ini "$p"
          done

  image:
    name: Docker — build the application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The application lives in its own repository; this repo only carries
      # the Dockerfile that builds it.
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          repository: wanedri/ship
          path: ship

      - name: Assemble the build context
        run: |
          cp app/Dockerfile ship/Dockerfile
          cp app/dockerignore ship/.dockerignore

      # This also runs the application's own pre-flight gate (npm test) inside
      # the build, so an invalid ship.config.json fails CI.
      - name: Build
        run: docker build -t ship:ci ship

      - name: Check the image actually serves
        run: |
          docker run -d --rm --name ship-ci -p 18080:80 ship:ci
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:18080/; then
              echo "OK - image serves on port 80"
              docker stop ship-ci
              exit 0
            fi
            sleep 1
          done
          echo "image did not serve"; docker logs ship-ci; docker stop ship-ci; exit 1
