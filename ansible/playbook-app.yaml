- name: Bina dan jalankan aplikasi ship
  hosts: web
  become: true

  vars:
    docker_users: [ubuntu]
    app_repo_url: "https://github.com/wanedri/ship.git"
    app_repo_version: "main"
    app_src_dir: /opt/ship
    app_container_name: ship
    app_host_port: 80

  roles:
    - geerlingguy.docker

  tasks:
    - name: Klon repo aplikasi
      git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_src_dir }}"
        version: "{{ app_repo_version }}"
      register: app_checkout

    - name: Hantar Dockerfile ke build context
      copy:
        src: ../app/Dockerfile
        dest: "{{ app_src_dir }}/Dockerfile"
        mode: "0644"
      register: app_dockerfile

    - name: Hantar .dockerignore ke build context
      copy:
        src: ../app/dockerignore
        dest: "{{ app_src_dir }}/.dockerignore"
        mode: "0644"
      register: app_dockerignore

    # Rebuild only when something that affects the image changed, so a second
    # run of this playbook reports zero changes.
    - name: Bina imej aplikasi
      community.docker.docker_image_build:
        name: "{{ ecr_image }}"
        tag: "{{ image_tag }}"
        path: "{{ app_src_dir }}"
        rebuild: >-
          {{ 'always'
             if (app_checkout.changed or app_dockerfile.changed or app_dockerignore.changed)
             else 'never' }}
      register: app_build

    # Password comes from the instance role via the metadata service.
    # No access keys on disk.
    - name: Log masuk ke ECR
      shell:
        cmd: >-
          set -o pipefail &&
          aws ecr get-login-password --region {{ aws_region }}
          | docker login --username AWS --password-stdin {{ ecr_registry }}
        executable: /bin/bash
      changed_when: false

    - name: Tolak imej ke ECR
      community.docker.docker_image_push:
        name: "{{ ecr_image }}"
        tag: "{{ image_tag }}"
      when: app_build.changed

    - name: Jalankan container aplikasi
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ ecr_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_host_port }}:80"

    - name: Tunggu laman web menjawab
      wait_for:
        host: 127.0.0.1
        port: "{{ app_host_port }}"
        timeout: 60
