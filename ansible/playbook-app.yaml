- name: Jalankan aplikasi ship dari imej ECR
  hosts: web
  become: true

  vars:
    docker_users: [ubuntu]
    app_container_name: ship
    app_host_port: 80

  roles:
    - geerlingguy.docker

  tasks:
    # Password comes from the instance role via the metadata service.
    # No access keys on disk.
    - name: Log masuk ke ECR
      shell:
        cmd: >-
          set -o pipefail &&
          aws ecr get-login-password --region {{ aws_region }}
          | docker login --username AWS --password-stdin {{ ecr_registry }}
        executable: /bin/bash
      register: ecr_login
      until: ecr_login.rc == 0
      retries: 6
      delay: 10
      changed_when: false

    # The image is built and pushed by GitHub Actions (.github/workflows/
    # deploy.yml). This host only pulls, which is why its IAM role needs
    # ECR read and nothing more.
    - name: Tarik imej dari ECR
      community.docker.docker_image_pull:
        name: "{{ ecr_image }}"
        tag: "{{ image_tag }}"
      register: app_pull

    # Reports changed only when the pulled image differs from the running
    # container's image, so a second run with no new build is a no-op.
    - name: Jalankan container aplikasi
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ ecr_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_host_port }}:80"

    - name: Tunggu laman web menjawab
      wait_for:
        host: 127.0.0.1
        port: "{{ app_host_port }}"
        timeout: 60
