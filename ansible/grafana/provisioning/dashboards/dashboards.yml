apiVersion: 1

providers:
  - name: 'bootcamp'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Anything you export from the Grafana UI into ansible/grafana/dashboards/
      # gets loaded from here on the next stack run.
      path: /var/lib/grafana/dashboards
